# Supabase CLI configuration for the eclipse.deyderae.dev project.
#
# Deliberately minimal. The CLI's `config push` writes every property declared here
# to the LIVE project, and the file `supabase init` generates declares hundreds of
# local-development defaults that would silently overwrite real hosted settings
# (redirect URLs, email confirmation, the site URL). So this file declares only what
# matters, set to what the live project uses:
#
#   npx supabase config diff     preview exactly what a push would change (read-only)
#   npx supabase config push     apply it; review the diff first
#
# The CLI fills any section a file does not declare with its OWN defaults when it
# builds the diff, so the sections below that this app does not use (MFA, phone,
# the pooler, storage) are declared only to mirror the live project, so a push cannot
# change them. Keep every value here equal to the dashboard's, apart from a change you
# mean to make. Check with `config diff` after any edit.
project_id = "eclipse-site"

[db]
major_version = 17

[auth]
# Where Supabase sends people when a link has no (or a disallowed) redirect, for
# example an expired sign-in link. The app also passes its own redirect per request.
site_url = "https://eclipse.deyderae.dev"
additional_redirect_urls = ["https://eclipse.deyderae.dev", "https://eclipse.deyderae.dev/**", "http://localhost:8787/**"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@mail.deyderae.dev"
sender_name = "Eclipse"

# ── mirrored from the live project; not used by the app ──────────────────────
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Phone sign-in is off (only email is a sign-in provider). The CLI cannot turn this SMS
# provider flag off ("config push" reports it as not encodable) and rejects "enabled"
# without credentials, so `config diff` always shows this one line. Ignore it.
[auth.sms.twilio]
enabled = false

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
