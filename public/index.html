<!DOCTYPE html>
<html lang="en" data-theme="mocha">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eclipse</title>
<meta name="description" content="Character sheets and a live DM roster for the Age of Eclipse tabletop game." />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/sheet.css" />
<script src="/script.js"></script>
<script src="/vendor/supabase.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="bar">
      <a class="brand" href="/">
        <img class="logo" src="/logo.svg" alt="" width="32" height="32" />
        <span class="wordmark">Eclipse <span>Survivor's Records</span></span>
      </a>
      <div class="account" id="account" hidden>
        <a class="btn btn-quiet btn-small" id="admin-link" href="/admin" hidden>Admin</a>
        <a class="btn btn-quiet btn-small" href="/characters">Characters</a>
        <a class="btn btn-quiet btn-small account-name" id="account-name" href="/account"></a>
        <button class="btn btn-quiet btn-small" id="sign-out" type="button">Sign out</button>
      </div>
      <div class="theme-switcher" role="group" aria-label="Theme switcher">
        <button class="theme-btn" data-swatch="latte" title="Latte" aria-label="Latte theme" aria-pressed="false"></button>
        <button class="theme-btn" data-swatch="frappe" title="Frapp&eacute;" aria-label="Frapp&eacute; theme" aria-pressed="false"></button>
        <button class="theme-btn" data-swatch="macchiato" title="Macchiato" aria-label="Macchiato theme" aria-pressed="false"></button>
        <button class="theme-btn" data-swatch="mocha" title="Mocha" aria-label="Mocha theme" aria-pressed="true"></button>
      </div>
    </div>
  </header>

  <main class="page" id="main">
    <noscript><p class="notice notice-info"><strong>Note: </strong>Eclipse needs JavaScript to sign you in and load your character sheet.</p></noscript>
    <p class="muted" role="status">Loading...</p>
  </main>
